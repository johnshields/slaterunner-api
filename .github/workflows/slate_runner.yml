name: slate_runner CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel older runs of the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src

      - name: Lint (flake8)
        run: flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Build console
        working-directory: app
        run: |
          npm ci
          npm run build

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Worker + Container to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Test /api status endpoint
        run: |
          set -e
          WORKER_URL="${{ secrets.SLATERUNNER_WORKER_URL }}"

          echo "GET /api ..."
          STATUS=$(curl -sSL "$WORKER_URL/api")
          echo "Response: $STATUS"
          echo "$STATUS" | grep -q '"ok":true' && echo "Status endpoint passed" || (echo "Unexpected response" && exit 1)

          echo "GET / (console) ..."
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$WORKER_URL/")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] && echo "Console passed" || (echo "Console not served" && exit 1)
