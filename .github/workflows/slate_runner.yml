name: slate_runner CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel older runs of the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: api

    env:
      API_HOST: 127.0.0.1
      API_PORT: 8049
      LOG_LEVEL: info
      PYTHONPATH: src
      DATABASE_PATH: slaterunner.db
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint (ruff)
        run: ruff check src

      - name: Lint (flake8)
        run: flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Start FastAPI (background)
        run: |
          python -m uvicorn main:app --app-dir src --host "$API_HOST" --port "$API_PORT" --log-level "$LOG_LEVEL" > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 5
          cat uvicorn.log || true

      - name: Health check API
        run: |
          set -e
          cat uvicorn.log || true
          curl -fsS "http://$API_HOST:$API_PORT/api/healthz" || curl -fsS "http://$API_HOST:$API_PORT/"

      - name: Run tests
        run: |
          pytest -q || echo "No tests or tests failed"

      - name: Stop Uvicorn
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
            rm -f uvicorn.pid
          fi

      - name: Upload server logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: api/uvicorn.log
